<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrarse | PsicoCitas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <link rel="stylesheet"
          th:href="@{/css/registro.css}">
</head>

<body>

<div class="pagina">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

        <div class="marca">
            <div class="logo">♡</div>
            <div>
                <h3>Calma</h3>
                <small>PSICOLOGÍA</small>
            </div>
        </div>

        <nav class="menu">
            <a th:href="@{/paciente/inicio}">
                ⌂ &nbsp; Inicio
            </a>

            <a href="#">
                ▦ &nbsp; Mis citas
            </a>

            <a href="#">
                ＋ &nbsp; Reservar cita
            </a>
        </nav>

    </aside>

    <!-- CONTENIDO -->
    <div class="contenido">

        <header class="encabezado">
            <div class="notificaciones">♧</div>
            <div class="usuario">
                ◯ &nbsp; Cuenta no iniciada
            </div>
        </header>

        <main class="formulario-contenedor">

            <div class="formulario">

                <h2>Registrarse</h2>

                <div th:if="${mensaje != null}"
                     class="alert alert-success"
                     th:text="${mensaje}">
                </div>

                <div th:if="${error != null}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/paciente/guardar}"
                      th:object="${paciente}"
                      method="post">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input id="nombre"
                               type="text"
                               th:field="*{nombre}"
                               maxlength="50"
                               required>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input id="telefono"
                               type="tel"
                               th:field="*{telefono}"
                               maxlength="20"
                               required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input id="correo"
                               type="email"
                               th:field="*{correo}"
                               required>
                    </div>

                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input id="apellidos"
                               type="text"
                               th:field="*{apellidos}"
                               maxlength="80"
                               required>
                    </div>

                    <div class="botones">
                        <button type="submit">
                            Continuar
                        </button>
                    </div>

                </form>

            </div>

        </main>

    </div>

</div>

</body>
</html>
