<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | PsicoCitas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>
<main class="formulario-contenedor">
    <section class="formulario">
        <h2>Iniciar sesión</h2>
        <div th:if="${param.error}" class="alert alert-danger">El correo o la contraseña son incorrectos, o la cuenta está inactiva.</div>
        <div th:if="${param.logout}" class="alert alert-success">La sesión se cerró correctamente.</div>
        <form th:action="@{/acceso/login}" method="post">
            <div class="campo"><label for="correo">Correo</label><input id="correo" name="correo" type="email" autocomplete="username" required></div>
            <div class="campo"><label for="contrasena">Contraseña</label><input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required></div>
            <div class="botones"><button type="submit">Ingresar</button></div>
        </form>
        <p class="text-center mt-4">¿Aún no tienes cuenta? <a th:href="@{/paciente/registro}">Regístrate</a></p>
    </section>
</main>
</body>
</html>
