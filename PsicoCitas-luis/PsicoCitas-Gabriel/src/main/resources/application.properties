spring.application.name=PsicoCitas
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psicocitas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Costa_Rica&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
