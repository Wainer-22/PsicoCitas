<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrarse | PsicoCitas</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<div class="pagina d-flex flex-column flex-lg-row min-vh-100 bg-light">

    <!-- MENU LATERAL -->
    <aside class="sidebar col-12 col-lg-3 col-xl-2 d-flex flex-column bg-white border-end p-3 flex-shrink-0">

        <div class="marca d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div class="logo rounded-circle bg-primary text-white d-flex align-items-center justify-content-center">♡</div>
            <div>
                <h3>Calma</h3>
                <small>PSICOLOGÍA</small>
            </div>
        </div>

        <nav class="menu nav nav-pills flex-column gap-2">
            <a th:href="@{/paciente/inicio}">
                ⌂ &nbsp; Inicio
            </a>

            <a href="#">
                ▦ &nbsp; Mis citas
            </a>

            <a href="#">
                ＋ &nbsp; Reservar cita
            </a>
        </nav>

    </aside>

    <!-- CONTENIDO -->
    <div class="contenido flex-grow-1 min-vh-100">

        <header class="encabezado d-flex justify-content-end align-items-center bg-white border-bottom p-3">
            <div class="notificaciones text-secondary">♧</div>
            <div class="usuario d-flex align-items-center gap-3">
                ◯ &nbsp; Cuenta no iniciada
            </div>
        </header>

        <main class="formulario-contenedor container py-4">

            <div class="formulario card shadow-sm border-0 p-3 p-md-4 mx-auto">

                <h2>Registrarse</h2>

                <div th:if="${mensaje != null}"
                     class="alert alert-success"
                     th:text="${mensaje}">
                </div>

                <div th:if="${error != null}"
                     class="alert alert-danger"
                     th:text="${error}">
                </div>

                <form th:action="@{/paciente/guardar}"
                      th:object="${paciente}"
                      method="post">

                    <div class="campo mb-3">
                        <label for="nombre">Nombre</label>
                        <input class="form-control" id="nombre"
                               type="text"
                               th:field="*{nombre}"
                               maxlength="50"
                               required>
                    </div>

                    <div class="campo mb-3">
                        <label for="telefono">Teléfono</label>
                        <input class="form-control" id="telefono"
                               type="tel"
                               th:field="*{telefono}"
                               maxlength="20"
                               required>
                    </div>

                    <div class="campo mb-3">
                        <label for="correo">Correo</label>
                        <input class="form-control" id="correo"
                               type="email"
                               th:field="*{correo}"
                               required>
                    </div>

                    <div class="campo mb-3">
                        <label for="apellidos">Apellidos</label>
                        <input class="form-control" id="apellidos"
                               type="text"
                               th:field="*{apellidos}"
                               maxlength="80"
                               required>
                    </div>

                    <div class="botones d-flex flex-wrap gap-2 mt-3">
                        <button type="submit">
                            Continuar
                        </button>
                    </div>

                </form>

            </div>

        </main>

    </div>

</div>

</body>
</html>
